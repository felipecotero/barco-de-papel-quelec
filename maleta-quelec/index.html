<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f4ed"><title>Morral de Quelec · Estudio 3D</title>
<style>
@font-face{font-family:Quiche;src:local('Quiche Display Regular'),local('QuicheDisplay-Regular'),local('Quiche Display')}
@font-face{font-family:Montserrat;src:url('../assets/fonts/Montserrat-SemiBold.woff2') format('woff2');font-weight:600}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font:16px Arial,Avenir,sans-serif;color:#263429;background:#f6f3eb}button,a{font:600 12px Montserrat,Arial,sans-serif}button{color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #a53d72;outline-offset:3px}
main{height:100svh;min-height:510px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:2100px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px clamp(18px,3.3vw,58px);border-bottom:1px solid #dcded1;background:#fbfaf5}
.identity{display:flex;align-items:center;gap:17px}.identity span{font:600 10px Montserrat,Arial,sans-serif;line-height:1.5;letter-spacing:.13em;text-transform:uppercase;color:#526456;border-right:1px solid #bdc7b8;padding-right:17px}.identity h1{margin:0;font:400 clamp(24px,2.9vw,40px)/1 Quiche,Georgia,serif;letter-spacing:-.038em}
.actions{display:flex;gap:10px;align-items:center}.action{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 15px;border:1px solid #c4cbbb;background:#fafbf4;border-radius:5px;text-decoration:none;white-space:nowrap;color:#304236}.action:hover,.action[aria-expanded=true]{background:#e8eddf}.download{background:#2e493b;color:white;border-color:#2e493b}.download:hover{background:#213c2f}.action svg{width:17px;height:17px}
.workspace{position:relative;min-height:0;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#fcfaf4,#efeee5)}.viewpane,.viewpane canvas{display:block;width:100%;height:100%;touch-action:none}.viewpane{position:absolute;inset:0}
#status{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);border:1px solid #d2dac9;background:#fbfcf5;padding:12px 18px;border-radius:6px;max-width:90%;text-align:center;font-size:14px;line-height:1.55;pointer-events:none}#status[hidden],#reference[hidden]{display:none}
#reference{position:absolute;left:20px;top:20px;width:clamp(155px,20vw,275px);background:white;border:1px solid #d5dbce;border-radius:8px;box-shadow:0 8px 24px #283a2314;padding:12px;margin:0}#reference figcaption{display:flex;align-items:center;justify-content:space-between;font:600 12px Montserrat,Arial,sans-serif}#reference img{width:100%;height:auto;max-height:44vh;object-fit:contain;display:block}#dismiss{border:none;background:transparent;font:22px/1.1 Arial;color:#546154;min-width:36px;min-height:32px}
footer{padding:14px clamp(18px,3.3vw,58px);display:flex;align-items:center;justify-content:space-between;gap:18px;border-top:1px solid #dcded1;background:#fbfaf5}
.views{display:flex;align-items:center;gap:3px;padding:3px;border:1px solid #d4d9cd;background:#eff1e8;border-radius:7px}.views button{border:0;border-radius:4px;background:transparent;padding:9px 14px;min-height:36px;line-height:1.2}.views button:hover{background:#e4eadb}.views button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px #32462626}.help{margin:0;text-align:right;font-size:12px;color:#626c5f;line-height:1.5}noscript{position:absolute;z-index:10;top:35%;left:10%;background:white;padding:20px}
@media(max-width:680px){main{min-height:530px}header{align-items:flex-start;flex-direction:column;gap:13px;padding:14px 16px}.identity h1{font-size:29px}.identity span{font-size:8px}.actions .action{min-height:37px;font-size:11px;padding:7px 11px}footer{padding:10px 12px;gap:7px;flex-direction:column;align-items:center}.views{width:min(100%,430px);justify-content:space-between}.views button{flex:auto;padding:8px 6px;font-size:11px;min-height:36px}.help{font-size:10px;text-align:center}#reference{left:8px;top:8px;width:132px;padding:7px}#reference figcaption{font-size:10px}}
@media(max-height:600px) and (min-width:680px){main{min-height:320px}header{padding-top:10px;padding-bottom:10px}footer{padding-top:7px;padding-bottom:7px}}
.identity .back{font:600 10px/1.5 Montserrat,Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#526456;text-decoration:none;border-right:1px solid #bdc7b8;padding-right:17px}.identity .back:hover{text-decoration:underline}.actions{flex-wrap:wrap}
button:disabled{opacity:.48;cursor:default}.action[aria-pressed=true]{background:#314b38;color:#fff}
.mark-tools{position:absolute;right:16px;top:14px;display:flex;align-items:center;gap:13px;padding:7px 12px;background:#fffef8;border:1px solid #c4cbbb;border-radius:7px;box-shadow:0 2px 14px #374c3515;color:#354637;font:600 12px Montserrat,Arial,sans-serif}
.mark-tools[hidden]{display:none}.mark-tools label{display:flex;gap:6px;align-items:center}.mark-tools input{width:30px;height:28px;border:none;background:transparent;padding:1px;cursor:pointer}.mark-tools button{background:transparent;border:0;border-left:1px solid #c6cebf;padding:7px 0 7px 12px}.mark-tools span{font:13px Arial,sans-serif;color:#5d695c}
dialog{background:#fcfbf6;color:#27392d;border:1px solid #c5cdbf;border-radius:12px;padding:26px;width:min(460px,calc(100% - 32px));box-shadow:0 20px 70px #0c261c44}dialog::backdrop{background:#14221ed1}dialog h2{font:400 29px/1.1 Quiche,Georgia,serif;margin:0 28px 12px 0}dialog p{font:15px/1.5 Arial,sans-serif}dialog .close-dialog{float:right;font:24px/1 Arial;border:0;background:none;color:#4e604f}.field-label{display:block;font:600 12px Montserrat,Arial,sans-serif;margin:15px 0 6px}textarea{display:block;border:1px solid #acb8a9;border-radius:5px;width:100%;padding:9px;resize:vertical;color:#344538;background:white;font:13px/1.4 Arial,sans-serif}.dialog-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.dialog-actions .action{padding:8px 10px}.dialog-actions input[hidden]{display:none}#mark-feedback:empty{display:none}#mark-feedback{margin:10px 0 0}
@media(max-width:680px){header{gap:9px}.actions{gap:5px}.mark-tools{top:8px;right:8px}.identity .back{font-size:9px}}
</style>
</head><body><main>
<header>
 <div class="identity"><a class="back" href="../#maleta-quelec">Taller de<br>objetos</a><h1>Morral de Quelec</h1></div>
 <div class="actions">
  <button id="draw-mode" class="action" aria-pressed="false" aria-controls="mark-tools" disabled>
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m4 20 5-1 12-12-4-4L5 15zm10-14 4 4"/></svg><span>Dibujar</span>
  </button>
  <button id="share-marks" class="action" disabled>Compartir marcas</button>
  <button id="reference-toggle" class="action" aria-expanded="false" aria-controls="reference">
   <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m4 17 5-6 4 4 3-3 5 5"/><circle cx="15.5" cy="8.5" r="1.2"/></svg>Boceto original
  </button>
  <a id="download" class="action download" download="Maleta-Quelec.glb" href="./Maleta-Quelec.glb">
   <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg>Descargar GLB
  </a>
 </div>
</header>
<section class="workspace" aria-label="Modelo tridimensional">
 <div class="viewpane" id="viewport"></div><p id="status" role="status">Abriendo el modelo…</p>
 <div id="mark-tools" class="mark-tools" role="group" aria-label="Herramientas de dibujo" hidden>
  <label for="ink-color">Color <input id="ink-color" type="color" value="#df264b"></label>
  <button id="undo-mark" type="button" disabled>Deshacer</button>
  <span id="mark-count" aria-live="polite">0 trazos</span>
 </div>
 <figure id="reference" hidden><figcaption>Boceto original <button id="dismiss" aria-label="Cerrar el boceto">×</button></figcaption><img alt="Boceto del morral de Quelec en forma de dinosaurio verde" src="boceto.png"></figure>
 <noscript>Activa JavaScript para girar el morral y descargar el archivo 3D.</noscript>
</section>
<footer>
 <nav class="views" aria-label="Vistas de la maleta">
  <button data-view="dibujo" aria-pressed="true">Tres cuartos</button><button data-view="frente" aria-pressed="false">Frente</button><button data-view="dorso" aria-pressed="false">Dorso</button><button data-view="perfil" aria-pressed="false">Perfil</button>
 </nav>
 <p class="help" id="help">Arrastra para girar. Usa la rueda o dos dedos para acercarte.</p>
</footer>
</main>
<dialog id="mark-dialog" aria-labelledby="dialog-title">
 <form method="dialog"><button aria-label="Cerrar" class="close-dialog">×</button></form>
 <h2 id="dialog-title">Compartir marcas</h2>
 <p id="share-hint">El enlace abre el morral con tus trazos y el mismo ángulo de vista.</p>
 <label for="share-url" class="field-label">Enlace a la vista marcada</label>
 <textarea id="share-url" rows="3" readonly spellcheck="false"></textarea>
 <div class="dialog-actions">
  <button id="copy-url" class="action download">Copiar enlace</button>
  <button id="export-marks" class="action">Guardar archivo</button>
  <button id="load-marks" class="action">Abrir archivo</button>
  <input id="import-marks" type="file" accept=".json,application/json" hidden>
 </div>
 <p id="mark-feedback" role="status"></p>
</dialog>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<script type="module">
import {show} from './viewer.js';
const $ = id => document.getElementById(id);
const fig = $('reference'), toggle = $('reference-toggle');
function reference(open) { fig.hidden = !open; toggle.setAttribute('aria-expanded', String(open)); }
toggle.onclick = () => reference(fig.hidden);
$('dismiss').onclick = () => {reference(false);toggle.focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!fig.hidden){reference(false);toggle.focus()}});
async function start(){
 const response=await fetch('./Maleta-Quelec.glb');
 if(!response.ok)throw Error('Modelo no disponible.');
 await show(await response.arrayBuffer());
}
start().catch(error=>{console.error(error);$('status').textContent='El visor necesita WebGL 2. Puedes ver el boceto y descargar el modelo GLB aquí.';reference(true);document.querySelectorAll('[data-view]').forEach(b=>b.disabled=true)});
</script></body></html>
