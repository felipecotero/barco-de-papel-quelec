name: Actualizar avances de utilería
on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/avances-utileria.yml'
      - 'tools/actualizar-avances.py'

permissions:
  contents: write

concurrency:
  group: avances-utileria
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            /tools/actualizar-avances.py
            /avances-utileria/estado.json
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Consultar el color de cada elemento y su estado escrito
        env:
          HENRY_SHEET_ID: ${{ secrets.HENRY_SHEET_ID }}
        run: python3 tools/actualizar-avances.py
      - name: Publicar los cambios de la matriz
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- avances-utileria/estado.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- avances-utileria/estado.json
          git commit -m 'Actualiza el avance de utilería desde la matriz'
          git pull --rebase origin main
          git push origin HEAD:main
